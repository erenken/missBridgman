name: Pull request build and test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          include-prerelease: true

      - name: Build solution
        run: dotnet build MissBridgman.slnx --configuration Release --verbosity minimal

      - name: Run automated tests
        run: dotnet test MissBridgman.slnx --configuration Release --no-build --no-restore --verbosity minimal

      - name: Validate Bicep template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
