name: Deploy Miss Bridgman

on:
  push:
    branches: [main]
    paths:
      - 'MissBridgman.Web/**'
      - 'infra/**'
      - '.github/workflows/blazor-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_DNS_ZONE: ${{ vars.AZURE_DNS_ZONE }}
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          include-prerelease: true

      - name: Check deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          for name in AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME AZURE_DNS_ZONE AZURE_CUSTOM_DOMAIN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ADMIN_PASSWORD AZURE_STORAGE_CONNECTION_STRING APPLICATIONINSIGHTS_CONNECTION_STRING; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish application
        run: |
          set -euo pipefail
          dotnet publish MissBridgman.Web/MissBridgman.Web.csproj \
            --configuration Release \
            --framework net11.0 \
            --runtime linux-x64 \
            --self-contained true \
            -p:UseAppHost=true \
            --output ./publish
          cat > ./publish/startup.sh <<'EOF'
          #!/bin/sh
          set -eu
          cd /home/site/wwwroot
          chmod +x ./MissBridgman.Web
          exec ./MissBridgman.Web
          EOF
          cd publish
          zip -qr ../publish.zip .
          cd ..

      - name: Configure application settings
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings "Admin__Password=$ADMIN_PASSWORD" "AzureWebJobsStorage=$AZURE_STORAGE_CONNECTION_STRING" "APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING" \
            --output none

      - name: Deploy application package
        run: |
          set -euo pipefail
          az webapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --set kind='app,linux' \
            --output none
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version 'dotnet|11' \
            --startup-file 'bash startup.sh' \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path ./publish.zip \
            --type zip \
            --clean true \
            --output none
          az webapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --https-only true \
            --output none

      - name: Confirm the app is healthy
        run: |
          set -euo pipefail
          url="https://$AZURE_WEBAPP_NAME.azurewebsites.net/healthz"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$url"; then
              exit 0
            fi
            sleep 10
          done
          echo "The app did not become healthy: $url" >&2
          exit 1

      - name: Bind missbridgman.com and HTTPS
        run: |
          set -euo pipefail
          app_ip=$(az resource show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --resource-type Microsoft.Web/sites --api-version 2024-04-01 --query inboundIpAddress --output tsv)
          app_host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          verification_id=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query customDomainVerificationId --output tsv)

          if [ -z "$app_ip" ] || [ "$app_ip" = "null" ]; then
            echo "Could not determine the App Service inbound IP address." >&2
            exit 1
          fi
          if ! az network dns record-set a show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name @ >/dev/null 2>&1; then
            az network dns record-set a create --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name @ --ttl 300 --output none
          fi
          if ! az network dns record-set a show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name @ --query "ARecords[?ipv4Address=='$app_ip'] | length(@)" --output tsv | grep -q '^1$'; then
            az network dns record-set a add-record --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --record-set-name @ --ipv4-address "$app_ip" --output none
          fi

          if ! az network dns record-set txt show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid >/dev/null 2>&1; then
            az network dns record-set txt create --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid --ttl 300 --output none
          fi
          if ! az network dns record-set txt show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid --query "TXTRecords[].value[]" --output tsv | grep -Fxq "$verification_id"; then
            az network dns record-set txt add-record --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --record-set-name asuid --value "$verification_id" --output none
          fi

          az network dns record-set cname set-record --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --record-set-name www --cname "$app_host" --output none
          if ! az network dns record-set txt show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid.www >/dev/null 2>&1; then
            az network dns record-set txt create --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid.www --ttl 300 --output none
          fi
          if ! az network dns record-set txt show --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --name asuid.www --query "TXTRecords[].value[]" --output tsv | grep -Fxq "$verification_id"; then
            az network dns record-set txt add-record --resource-group "$AZURE_RESOURCE_GROUP" --zone-name "$AZURE_DNS_ZONE" --record-set-name asuid.www --value "$verification_id" --output none
          fi

          for hostname in "$AZURE_CUSTOM_DOMAIN" "www.$AZURE_CUSTOM_DOMAIN"; do
            if ! az webapp config hostname list --resource-group "$AZURE_RESOURCE_GROUP" --webapp-name "$AZURE_WEBAPP_NAME" --query "[?name=='$hostname'] | length(@)" --output tsv | grep -q '^1$'; then
              az webapp config hostname add --resource-group "$AZURE_RESOURCE_GROUP" --webapp-name "$AZURE_WEBAPP_NAME" --hostname "$hostname" --output none
            fi
            thumbprint=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query "hostNameSslStates[?name=='$hostname'].thumbprint | [0]" --output tsv)
            if [ -n "$thumbprint" ] && [ "$thumbprint" != "null" ]; then
              continue
            fi
            if [ -z "$thumbprint" ] || [ "$thumbprint" = "null" ]; then
              az webapp config ssl create --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --hostname "$hostname" --certificate-name "$hostname" --output none
              for attempt in {1..30}; do
                thumbprint=$(az resource show --resource-group "$AZURE_RESOURCE_GROUP" --name "$hostname" --resource-type Microsoft.Web/certificates --api-version 2024-04-01 --query properties.thumbprint --output tsv 2>/dev/null || true)
                if [ -n "$thumbprint" ] && [ "$thumbprint" != "null" ]; then
                  break
                fi
                sleep 10
              done
            fi
            if [ -z "$thumbprint" ] || [ "$thumbprint" = "null" ]; then
              echo "Managed TLS certificate was not available for $hostname after five minutes." >&2
              exit 1
            fi
            az webapp config ssl bind --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --hostname "$hostname" --certificate-thumbprint "$thumbprint" --ssl-type SNI --output none
          done
