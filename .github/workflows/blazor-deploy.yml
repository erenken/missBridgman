name: Deploy Miss Bridgman

on:
  push:
    branches: [main]
    paths:
      - 'MissBridgman.Web/**'
      - 'infra/**'
      - '.github/workflows/blazor-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_DNS_ZONE: ${{ vars.AZURE_DNS_ZONE }}
      AZURE_CUSTOM_DOMAIN: ${{ vars.AZURE_CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          include-prerelease: true

      - name: Check deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          for name in AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME AZURE_DNS_ZONE AZURE_CUSTOM_DOMAIN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ADMIN_PASSWORD AZURE_STORAGE_CONNECTION_STRING APPLICATIONINSIGHTS_CONNECTION_STRING; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish application
        run: |
          set -euo pipefail
          dotnet publish MissBridgman.Web/MissBridgman.Web.csproj \
            --configuration Release \
            --framework net11.0 \
            --runtime linux-x64 \
            --self-contained true \
            -p:UseAppHost=true \
            --output ./publish
          cat > ./publish/startup.sh <<'EOF'
          #!/bin/sh
          set -eu
          cd /home/site/wwwroot
          chmod +x ./MissBridgman.Web
          exec ./MissBridgman.Web
          EOF
          cd publish
          zip -qr ../publish.zip .
          cd ..

      - name: Configure application settings
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings "Admin__Password=$ADMIN_PASSWORD" "AzureWebJobsStorage=$AZURE_STORAGE_CONNECTION_STRING" "APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING" \
            --output none

      - name: Deploy application package
        run: |
          set -euo pipefail
          az webapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --set kind='app,linux' \
            --output none
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version 'dotnet|11' \
            --startup-file 'bash startup.sh' \
            --output none
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path ./publish.zip \
            --type zip \
            --clean true \
            --output none
          az webapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --https-only true \
            --output none

      - name: Confirm the app is healthy
        run: |
          set -euo pipefail
          url="https://$AZURE_WEBAPP_NAME.azurewebsites.net/healthz"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$url"; then
              exit 0
            fi
            sleep 10
          done
          echo "The app did not become healthy: $url" >&2
          exit 1
